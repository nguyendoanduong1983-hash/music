name: Auto Generate Music Index

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'index.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (fast metadata only)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate index.json
        run: |
          python - << 'EOF'
          import os
          import json
          import urllib.parse
          import subprocess
          import re

          INDEX_FILE = "index.json"
          existing_data = []

          if os.path.exists(INDEX_FILE):
              try:
                  with open(INDEX_FILE, "r", encoding="utf-8") as f:
                      existing_data = json.load(f)
              except Exception as e:
                  print(f"Warning: Could not parse existing index.json: {e}")
                  existing_data = []

          existing_map = {}
          for item in existing_data:
              path = item.get("path", "")
              if path:
                  existing_map[path] = item

          # Lấy toàn bộ danh sách file trong git tree cực nhanh mà không cần tải file MP3
          out = subprocess.check_output(
              ["git", "-c", "core.quotePath=false", "ls-tree", "-r", "--name-only", "HEAD"],
              encoding="utf-8"
          )
          mp3_files = [line.strip() for line in out.splitlines() if line.strip().lower().endswith(".mp3")]

          songs = []
          for rel_path in sorted(mp3_files):
              rel_path = rel_path.replace("\\", "/")
              encoded_path = urllib.parse.quote(rel_path, safe="/")

              if "/" in rel_path:
                  folder_name, file_name = rel_path.split("/", 1)
                  # Nếu có thư mục con sâu hơn, lấy tên file cuối cùng
                  file_name = os.path.basename(rel_path)
              else:
                  folder_name = "songs"
                  file_name = rel_path

              lower_folder = folder_name.lower()
              lower_file = file_name.lower()
              if any(w in lower_folder or w in lower_file for w in ["truyen", "truyện", "kể chuyện", "story", "radio"]):
                  category = "story"
              else:
                  category = "song"

              clean_name = os.path.splitext(file_name)[0].replace("_", " ").strip()
              clean_name = re.sub(r"\s*-\s*YouTube Music$", "", clean_name, flags=re.IGNORECASE)

              # Giữ tên bài hát đã có trong index.json cũ (như thư mục songs/ không dấu)
              if encoded_path in existing_map:
                  old_item = existing_map[encoded_path]
                  name = old_item.get("name") or old_item.get("title") or clean_name
                  # Bỏ số thứ tự cũ ở đầu nếu có (VD: "13. Lỡ Khen Người Chết" -> "Lỡ Khen Người Chết")
                  name = re.sub(r"^\d+\.\s*", "", name).strip()
                  tags = old_item.get("tags", [])
                  if folder_name.lower() not in [t.lower() for t in tags]:
                      tags.append(folder_name)
              else:
                  name = clean_name
                  tags = [folder_name]

              songs.append({
                  "id": "",
                  "name": name,
                  "category": category,
                  "folder": folder_name,
                  "path": encoded_path,
                  "tags": tags
              })

          # Sắp xếp theo thư mục và tên bài
          songs.sort(key=lambda x: (x.get("folder", ""), x.get("name", "")))

          for idx, item in enumerate(songs, 1):
              prefix = "story" if item.get("category") == "story" else "song"
              item["id"] = f"{prefix}_{idx:03d}"

          with open(INDEX_FILE, "w", encoding="utf-8") as f:
              json.dump(songs, f, ensure_ascii=False, indent=2)

          print(f"Successfully generated {INDEX_FILE} with {len(songs)} tracks.")
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --staged --quiet; then
            echo "No changes in index.json. Everything is up to date."
          else
            git commit -m "Auto update index.json [skip ci]"
            git push
            echo "Successfully updated and pushed index.json"
          fi
