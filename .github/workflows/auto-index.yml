name: Auto Generate Music Index

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'index.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (fast metadata only)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate index.json
        run: |
          python - << 'EOF'
          import os
          import json
          import urllib.parse
          import subprocess
          import re
          from collections import defaultdict

          INDEX_FILE = "index.json"
          MAX_TOTAL_TRACKS = 68

          SONG_NAME_MAP = {
              "songs/01-the-luong-phuc-chinh.mp3": "Thê Lương - Phúc Chinh",
              "songs/02-bai-ca-dao-dau-roi.mp3": "Bài ca dao đâu rồi - Quang Linh",
              "songs/03-bien-noi-nho-va-em.mp3": "Biển nỗi nhớ và em - Đàm Vĩnh Hưng",
              "songs/04-bong-do-cap-ngang-ben-song.mp3": "Bóng đò cập ngang bến sông",
              "songs/05-buoc-chan-le-loi.mp3": "Bước chân lẻ loi - Đan Trường",
              "songs/06-cam-on-mot-niem-dau.mp3": "Cảm ơn một niềm đau - Đàm Vĩnh Hưng",
              "songs/07-cho-vua-long-em.mp3": "Cho vừa lòng em - Đàm Vĩnh Hưng",
              "songs/08-lien-khuc-mai-lo-minh-xa-nhau.mp3": "LK Mai lỡ mình xa nhau",
              "songs/09-mot-minh.mp3": "Một mình",
              "songs/10-nhu-mot-giac-mo.mp3": "Như một giấc mơ (Xin đừng khóc)",
              "songs/11-ha-noi-run-run-heo-may.mp3": "Hà Nội run run heo may - Tuấn Hiệp",
              "songs/12-xom-dem.mp3": "Xóm đêm - Thanh Hà"
          }

          out = subprocess.check_output(
              ["git", "-c", "core.quotePath=false", "ls-tree", "-r", "--name-only", "HEAD"],
              encoding="utf-8"
          )
          mp3_files = [line.strip() for line in out.splitlines() if line.strip().lower().endswith(".mp3")]

          by_folder = defaultdict(list)
          for rel_path in sorted(mp3_files):
              rel_path = rel_path.replace("\\", "/")
              if re.search(r"\(\d+\)\.mp3$", rel_path, flags=re.IGNORECASE):
                  continue
              folder = rel_path.split("/", 1)[0] if "/" in rel_path else "songs"
              by_folder[folder].append(rel_path)

          folders = sorted(by_folder.keys())
          selected_paths = []
          round_idx = 0
          while len(selected_paths) < MAX_TOTAL_TRACKS:
              added_in_round = False
              for f in folders:
                  if round_idx < len(by_folder[f]):
                      selected_paths.append((f, by_folder[f][round_idx]))
                      added_in_round = True
                      if len(selected_paths) >= MAX_TOTAL_TRACKS:
                          break
              if not added_in_round:
                  break
              round_idx += 1

          selected_paths.sort(key=lambda x: (x[0], x[1]))

          songs = []
          tagged_folders = set()
          for idx, (folder, rel_path) in enumerate(selected_paths, 1):
              encoded_path = urllib.parse.quote(rel_path, safe="/")
              file_name = os.path.basename(rel_path)
              if rel_path in SONG_NAME_MAP:
                  clean_name = SONG_NAME_MAP[rel_path]
              else:
                  clean_name = os.path.splitext(file_name)[0].replace("_", " ").strip()
                  clean_name = re.sub(r"\s*-\s*YouTube Music$", "", clean_name, flags=re.IGNORECASE)
                  if len(clean_name) > 28:
                      clean_name = clean_name[:28].strip()

              lower_folder = folder.lower()
              cat = "story" if any(w in lower_folder for w in ["truyen", "truyện", "kể chuyện", "story", "radio"]) else "song"

              item = {
                  "name": clean_name,
                  "path": encoded_path
              }

              songs.append(item)

          with open(INDEX_FILE, "w", encoding="utf-8") as f:
              json.dump(songs, f, ensure_ascii=False, separators=(",", ":"))

          print(f"Successfully generated {INDEX_FILE} with {len(songs)} tracks across {len(folders)} folders.")
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --staged --quiet; then
            echo "No changes in index.json. Everything is up to date."
          else
            git commit -m "Auto update index.json [skip ci]"
            git push
            echo "Successfully updated and pushed index.json"
          fi
