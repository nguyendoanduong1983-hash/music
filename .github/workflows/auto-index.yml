name: Auto Generate Music Index

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'index.json'
      - '.github/**'
      - 'README.md'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mutagen

      - name: Generate index.json
        run: |
          python - << 'EOF'
          import os
          import json
          import urllib.parse
          import re
          from mutagen.easyid3 import EasyID3

          INDEX_FILE = "index.json"
          existing_data = []

          # Đọc dữ liệu cũ nếu có để giữ nguyên các bài đã tùy biến
          if os.path.exists(INDEX_FILE):
              try:
                  with open(INDEX_FILE, "r", encoding="utf-8") as f:
                      existing_data = json.load(f)
              except Exception as e:
                  print(f"Warning: Could not parse existing index.json: {e}")
                  existing_data = []

          existing_map = {}
          for item in existing_data:
              path = item.get("path", "")
              if path:
                  existing_map[path] = item

          songs = []
          counter = 1

          # Duyệt tất cả thư mục tìm file .mp3
          for root, dirs, files in os.walk("."):
              # Bỏ qua thư mục ẩn của git và github
              if ".git" in root or ".github" in root:
                  continue

              for file in sorted(files):
                  if not file.lower().endswith(".mp3"):
                      continue

                  rel_dir = os.path.relpath(root, ".")
                  rel_path = file if rel_dir == "." else os.path.join(rel_dir, file)
                  rel_path = rel_path.replace("\\", "/") # Chuẩn hóa slash

                  # URL encode đường dẫn (giữ nguyên '/')
                  encoded_path = urllib.parse.quote(rel_path, safe="/")

                  # Xác định thư mục cha
                  folder_name = "root" if rel_dir == "." else rel_dir.replace("\\", "/")

                  # Xác định thể loại
                  lower_folder = folder_name.lower()
                  lower_file = file.lower()
                  if any(w in lower_folder or w in lower_file for w in ["truyen", "truyện", "kể chuyện", "story"]):
                      category = "story"
                  else:
                      category = "song"

                  # Nếu bài đã có trong index.json cũ, tái sử dụng metadata
                  if encoded_path in existing_map:
                      item = existing_map[encoded_path].copy()
                      item["folder"] = folder_name
                      item["category"] = category
                      songs.append(item)
                      continue

                  # Bài mới: Đọc Title và Artist từ file MP3 hoặc lấy tên file
                  full_file_path = os.path.join(root, file)
                  clean_name = os.path.splitext(file)[0].replace("_", " ").strip()
                  title = clean_name
                  artist = "Đang cập nhật"

                  try:
                      audio = EasyID3(full_file_path)
                      if "title" in audio and audio["title"][0].strip():
                          title = audio["title"][0].strip()
                      if "artist" in audio and audio["artist"][0].strip():
                          artist = audio["artist"][0].strip()
                  except Exception:
                      # Nếu file không có EasyID3, thử tách Tên - Ca sĩ từ tên file nếu có dấu gạch ngang
                      if " - " in clean_name:
                          parts = clean_name.split(" - ", 1)
                          artist = parts[0].strip()
                          title = parts[1].strip()

                  # Tạo tag tìm kiếm giọng nói
                  tags = [folder_name.lower()]
                  for word in re.split(r'[\s\-_]+', title.lower()):
                      if len(word) > 1 and word not in tags:
                          tags.append(word)

                  item = {
                      "id": f"{category}_{counter:03d}",
                      "title": title,
                      "artist": artist,
                      "category": category,
                      "folder": folder_name,
                      "path": encoded_path,
                      "tags": tags
                  }
                  counter += 1
                  songs.append(item)

          # Sắp xếp danh sách theo thư mục, sau đó theo tên bài
          songs.sort(key=lambda x: (x.get("folder", ""), x.get("title", "")))

          # Đánh lại ID theo thứ tự đẹp mắt
          for idx, item in enumerate(songs, 1):
              prefix = "story" if item.get("category") == "story" else "song"
              item["id"] = f"{prefix}_{idx:03d}"

          # Ghi ra index.json định dạng UTF-8
          with open(INDEX_FILE, "w", encoding="utf-8") as f:
              json.dump(songs, f, ensure_ascii=False, indent=2)

          print(f"Successfully generated {INDEX_FILE} with {len(songs)} tracks.")
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --staged --quiet; then
            echo "No changes in index.json. Everything is up to date."
          else
            git commit -m "Auto update index.json [skip ci]"
            git push
            echo "Successfully updated and pushed index.json"
          fi
